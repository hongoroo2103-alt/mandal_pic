name: Mandal free Facebook image generator
on:
  workflow_dispatch:
  push:
    paths:
      - 'mandal.py'
      - '.github/workflows/generate.yml'
  schedule:
    - cron: '20 4 * * 6'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow
      - name: Generate image cards for next 15 days
        run: python mandal.py --days 15
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ captions/
          git diff --cached --quiet || (git commit -m "Generate Mandal Facebook images" && git push)
